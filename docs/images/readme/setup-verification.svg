<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">FalseWake setup and safe verification</title>
<desc id="desc">Hash-locked setup, safe evidence checks, and the explicit boundary against running registered experiments 002 through 006.</desc>
<style>text{font-family:Arial, Helvetica, sans-serif;fill:#172033}.mono{font-family:'DejaVu Sans Mono', 'Liberation Mono', monospace}.title{font-size:34px;font-weight:700}.subtitle{font-size:17px}.section{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:12px}.metric{font-size:29px;font-weight:700}.label{font-size:14px;font-weight:700;letter-spacing:.5px}</style>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<text x="70" y="55" class="label" fill="#234C78" text-anchor="start">FALSEWAKE · REPRODUCIBLE WORKFLOW</text>
<text x="70" y="103" class="title" fill="#172033" text-anchor="start">Setup and safe verification</text>
<text x="70" y="139" class="subtitle" fill="#596579" text-anchor="start">Python 3.12.3 · hash-locked dependencies · deterministic evidence checks</text>
<line x1="70" y1="165" x2="1530" y2="165" stroke="#D9E0EA" stroke-width="1.5"/>
<rect x="75" y="225" width="455" height="540" rx="14" fill="#DCEAF7" stroke="#234C78" stroke-width="1.5"/>
<text x="103" y="270" class="label" fill="#234C78" text-anchor="start">1 · CREATE ENVIRONMENT</text>
<rect x="572" y="225" width="455" height="540" rx="14" fill="#F7F9FC" stroke="#234C78" stroke-width="1.5"/>
<text x="600" y="270" class="label" fill="#234C78" text-anchor="start">2 · VERIFY SAFE EVIDENCE</text>
<rect x="1069" y="225" width="455" height="540" rx="14" fill="#FBE9D2" stroke="#8E4E08" stroke-width="1.5"/>
<text x="1097" y="270" class="label" fill="#8E4E08" text-anchor="start">3 · RESPECT EXECUTION BOUNDARY</text>
<text x="103" y="326" class="small mono" fill="#172033" text-anchor="start"><tspan x="103" dy="0">python3.12 -m venv .venv</tspan><tspan x="103" dy="34">.venv/bin/python -m pip install \</tspan><tspan x="103" dy="34">  --require-hashes -r requirements-dev.lock</tspan><tspan x="103" dy="34">.venv/bin/python -m pip install \</tspan><tspan x="103" dy="34">  --no-deps --no-build-isolation -e .</tspan></text>
<text x="103" y="550" class="section" fill="#172033" text-anchor="start">Locked inputs</text>
<text x="103" y="587" class="body" fill="#596579" text-anchor="start"><tspan x="103" dy="0">.python-version → 3.12.3</tspan><tspan x="103" dy="32">requirements-dev.lock → hashes</tspan><tspan x="103" dy="32">requirements-train-ci.lock → CPU hashes</tspan><tspan x="103" dy="32">pyproject.toml → Python ≥3.12</tspan></text>
<text x="600" y="326" class="small mono" fill="#172033" text-anchor="start"><tspan x="600" dy="0">python tools/render_portfolio_visuals.py check</tspan><tspan x="600" dy="34"></tspan><tspan x="600" dy="34">python -m pytest -q \</tspan><tspan x="600" dy="34">  tests/test_result_plots.py \</tspan><tspan x="600" dy="34">  tests/test_portfolio_visuals.py</tspan></text>
<text x="600" y="550" class="section" fill="#172033" text-anchor="start">Check performs</text>
<text x="600" y="587" class="body" fill="#596579" text-anchor="start"><tspan x="600" dy="0">• recompute report-000/001 plots</tspan><tspan x="600" dy="32">• byte-compare 3 SVG + 3 PNG</tspan><tspan x="600" dy="32">• verify 7 SVG + provenance</tspan><tspan x="600" dy="32">• read only the static source allowlist</tspan></text>
<text x="1097" y="326" class="label" fill="#234C78" text-anchor="start">SAFE</text>
<text x="1097" y="365" class="body" fill="#172033" text-anchor="start"><tspan x="1097" dy="0">Plotting Experiments 000/001</tspan><tspan x="1097" dy="34">Static source/report inspection</tspan><tspan x="1097" dy="34">Ruff · strict mypy · portable tests</tspan></text>
<line x1="1097" y1="470" x2="1494" y2="470" stroke="#8E4E08" stroke-width="2"/>
<text x="1097" y="518" class="label" fill="#8E4E08" text-anchor="start">NOT PERFORMED</text>
<text x="1097" y="557" class="body" fill="#8E4E08" text-anchor="start" font-weight="700"><tspan x="1097" dy="0">No Experiment 002–006 import</tspan><tspan x="1097" dy="34">No runner / coordinator / supervisor</tspan><tspan x="1097" dy="34">No seed worker / authority issuer</tspan><tspan x="1097" dy="34">No attempt-marker access</tspan><tspan x="1097" dy="34">No registered experiment execution</tspan></text>
<rect x="185" y="825" width="1230" height="72" rx="10" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="1.5"/>
<text x="800" y="855" class="body" fill="#172033" text-anchor="middle" font-weight="700">CI repeats Ruff, evidence verification, focused render tests, strict mypy, and portable tests.</text>
<text x="800" y="884" class="small" fill="#596579" text-anchor="middle">The evidence renderer never turns documentation verification into an experiment attempt.</text>
<line x1="70" y1="932" x2="1530" y2="932" stroke="#D9E0EA" stroke-width="1.5"/>
<text x="70" y="957" class="tiny" fill="#596579" text-anchor="start">Sources: .python-version · dev/train locks · pyproject.toml · CI workflow</text>
<text x="1530" y="957" class="tiny" fill="#8E4E08" text-anchor="end" font-weight="700">Safe verification only</text>
</svg>
