<text x="265" y="820" class="small" fill="#596579" text-anchor="start">Registered authority/coordinator/runner were not invoked.</text>
<circle cx="170" cy="907" r="20" fill="#D27A16" stroke="#FFFFFF" stroke-width="2"/>
<text x="105" y="914" class="section" fill="#172033" text-anchor="middle">006</text>
