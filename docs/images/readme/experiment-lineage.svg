<text x="265" y="897" class="label" fill="#D27A16" text-anchor="start">INVOKED · TERMINAL</text>
<text x="520" y="898" class="body" fill="#172033" text-anchor="start" font-weight="700">final_registration_capability_rejected_after_prior_state_change</text>
<text x="265" y="932" class="small" fill="#596579" text-anchor="start">Root cause is undetermined from retained evidence; no retry.</text>
<rect x="235" y="965" width="1280" height="62" rx="10" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="1.5"/>
<text x="875" y="992" class="small" fill="#8E4E08" text-anchor="middle" font-weight="700">Experiment 006: plausible observer interference was recorded, but overlap and root cause were not established.</text>
<text x="875" y="1017" class="small" fill="#596579" text-anchor="middle">Incidents are evidence of controls and limits—not successful scientific benchmarks.</text>
<line x1="70" y1="1092" x2="1530" y2="1092" stroke="#D9E0EA" stroke-width="1.5"/>
<text x="70" y="1117" class="tiny" fill="#596579" text-anchor="start">Sources: committed result and incident JSON for Experiments 000–006</text>
<text x="1530" y="1117" class="tiny" fill="#8E4E08" text-anchor="end" font-weight="700">No experiment executed by this renderer</text>
