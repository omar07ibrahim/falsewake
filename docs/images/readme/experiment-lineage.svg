<text x="520" y="226" class="body" fill="#172033" text-anchor="start" font-weight="700">Clip baseline complete</text>
<text x="265" y="260" class="small" fill="#596579" text-anchor="start">Argmax clip metrics; thresholds and streaming were not evaluated.</text>
