<text x="265" y="337" class="label" fill="#356FAE" text-anchor="start">MEASURED · REJECTED</text>
<text x="520" y="338" class="body" fill="#172033" text-anchor="start" font-weight="700">Replay grid reject</text>
<text x="265" y="372" class="small" fill="#596579" text-anchor="start">No threshold satisfied retention and false-event gates together.</text>
<circle cx="170" cy="459" r="20" fill="#D27A16" stroke="#FFFFFF" stroke-width="2"/>
<text x="105" y="466" class="section" fill="#172033" text-anchor="middle">002</text>
