<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="516" viewBox="0 0 1720 516" role="img" aria-labelledby="metrics_frontiers-title metrics_frontiers-description">
  <title id="metrics_frontiers-title">Measured metrics and development frontier</title>
  <desc id="metrics_frontiers-description">Exact lines 1-16 from evidence-inspection.txt.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', monospace; }
    .title { fill: #f8fafc; font-size: 21px; font-weight: 700; }
    .meta { fill: #94a3b8; font-size: 14px; }
    .terminal { fill: #e2e8f0; font-size: 16px; }
    .line-number { fill: #64748b; }
  </style>
  <rect x="1" y="1" width="1718" height="514" rx="12" fill="#0b1020" stroke="#334155" stroke-width="2"/>
  <circle cx="28" cy="25" r="6" fill="#fb7185"/>
  <circle cx="48" cy="25" r="6" fill="#fbbf24"/>
  <circle cx="68" cy="25" r="6" fill="#4ade80"/>
  <text x="92" y="32" class="title">Measured metrics and development frontier</text>
  <text x="28" y="63" class="meta">$ python3 tools/inspect_evidence.py | stdout lines 1-16</text>
  <text x="28" y="85" class="meta">source: evidence-inspection.txt | exact line-range excerpt</text>
  <text x="28" y="112" class="terminal"><tspan class="line-number">01</tspan><tspan x="72">FalseWake tracked evidence inspection</tspan></text>
  <text x="28" y="136" class="terminal"><tspan class="line-number">02</tspan><tspan x="72">mode: read-only, hash-pinned, no experiment-code imports</tspan></text>
  <text x="28" y="160" class="terminal"><tspan class="line-number">03</tspan><tspan x="72">sources: 10 fixed JSON records</tspan></text>
  <text x="28" y="184" class="terminal"><tspan class="line-number">04</tspan><tspan x="72"></tspan></text>
  <text x="28" y="208" class="terminal"><tspan class="line-number">05</tspan><tspan x="72">000 | MEASURED CLIP BASELINE</tspan></text>
  <text x="28" y="232" class="terminal"><tspan class="line-number">06</tspan><tspan x="72">  validation: n=4,429; accuracy=56.88%; macro-F1=0.562; target argmax error=43.61%; unknown-&gt;target=80.72%; silence-&gt;target=0.00%</tspan></text>
  <text x="28" y="256" class="terminal"><tspan class="line-number">07</tspan><tspan x="72">  test: n=4,884; accuracy=56.41%; macro-F1=0.558; target argmax error=44.18%; unknown-&gt;target=81.23%; silence-&gt;target=0.00%</tspan></text>
  <text x="28" y="280" class="terminal"><tspan class="line-number">08</tspan><tspan x="72">  limits: thresholds/streaming not evaluated; validation diagnostic only</tspan></text>
  <text x="28" y="304" class="terminal"><tspan class="line-number">09</tspan><tspan x="72"></tspan></text>
  <text x="28" y="328" class="terminal"><tspan class="line-number">10</tspan><tspan x="72">001 | MEASURED DEVELOPMENT REPLAY | REJECT</tspan></text>
  <text x="28" y="352" class="terminal"><tspan class="line-number">11</tspan><tspan x="72">  corpus: 2,703 utterances; 40 speakers; 308,310,400 scored samples</tspan></text>
  <text x="28" y="376" class="terminal"><tspan class="line-number">12</tspan><tspan x="72">  retention pass maximum: threshold=0.395; retention=0.801724; events=10,147; reported FEH=1895.710297</tspan></text>
  <text x="28" y="400" class="terminal"><tspan class="line-number">13</tspan><tspan x="72">  retention fail next: threshold=0.396; retention=0.799330; events=10,113; reported FEH=1889.358257</tspan></text>
  <text x="28" y="424" class="terminal"><tspan class="line-number">14</tspan><tspan x="72">  negative fail previous: threshold=0.990; retention=0.001916; events=6; reported FEH=1.120948</tspan></text>
  <text x="28" y="448" class="terminal"><tspan class="line-number">15</tspan><tspan x="72">  negative pass minimum: threshold=0.991; retention=0.001437; events=4; reported FEH=0.747299</tspan></text>
  <text x="28" y="472" class="terminal"><tspan class="line-number">16</tspan><tspan x="72">  limits: no selected threshold; no holdout or production-rate claim</tspan></text>
</svg>
