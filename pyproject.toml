[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "falsewake"
version = "0.0.0"
description = "Streaming open-set keyword spotting with measured false activations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Omar Ibrahim" }]
dependencies = [
  "matplotlib>=3.11,<4",
  "numpy>=2.5,<3",
  "scikit-learn>=1.9,<2",
  "scipy>=1.18,<2",
  "soundfile>=0.14,<1",
]

[project.scripts]
falsewake-features = "falsewake.feature_matrix:main"
falsewake-linear = "falsewake.linear_baseline:main"
falsewake-librispeech = "falsewake.librispeech:main"
falsewake-manifest = "falsewake.speech_commands:main"
falsewake-plots = "falsewake.result_plots:main"
falsewake-replay = "falsewake.continuous_replay:main"

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/falsewake"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
