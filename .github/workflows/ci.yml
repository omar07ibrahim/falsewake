name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C
  TZ: UTC
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONNOUSERSITE: "1"
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/falsewake-matplotlib
  OMP_DYNAMIC: "FALSE"
  OMP_NUM_THREADS: "2"
  MKL_DYNAMIC: "FALSE"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Locked quality and portfolio evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked portable environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Lint
        run: python -m ruff check --no-cache --output-format=github .

      - name: Verify portfolio evidence
        run: |
          python tools/inspect_evidence.py --json > /dev/null
          python tools/capture_evidence_terminal.py check
          python tools/render_portfolio_visuals.py check

      - name: Test evidence rendering
        run: |
          python -m pytest -q -W error -p no:cacheprovider \
            tests/test_result_plots.py \
            tests/test_portfolio_visuals.py

  validation:
    name: Types and portable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Protocol tests verify the immutable Experiment 002/003 commit chain.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-train-ci.lock

      - name: Materialize the registered repository path
        run: |
          test ! -e /home/ubuntu/gitcode/falsewake
          sudo install -d \
            -o "$(id -u)" \
            -g "$(id -g)" \
            /home/ubuntu/gitcode
          cp -a -- "$GITHUB_WORKSPACE" /home/ubuntu/gitcode/falsewake

      - name: Install registered CPU runtime
        working-directory: /home/ubuntu/gitcode/falsewake
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install \
            --require-hashes \
            -r requirements-train-ci.lock
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            --editable .
          python -m pip check

      - name: Strict type check
        working-directory: /home/ubuntu/gitcode/falsewake
        run: python -m mypy --no-incremental --show-error-codes

      - name: Verify portfolio evidence
        working-directory: /home/ubuntu/gitcode/falsewake
        run: python tools/render_portfolio_visuals.py check

      - name: Portable unit tests
        # The omitted files exercise the registered host's fixed paths,
        # frozen executables, live taskset chain, and owned output roots.
        working-directory: /home/ubuntu/gitcode/falsewake
        run: |
          python -m pytest -q -W error -p no:cacheprovider \
            --ignore=tests/test_experiment_002_runner.py \
            --ignore=tests/test_experiment_002_supervisor.py \
            --ignore=tests/test_experiment_002_child_result.py \
            --ignore=tests/test_experiment_002_seed_worker.py \
            --ignore=tests/test_experiment_003_runner.py \
            --deselect=tests/test_experiment_004_runner.py::test_isolated_command_is_forced_to_fail_before_registration
